# VS Code OS kiosk hardening.
#
#   DontVTSwitch  - Ctrl+Alt+F1..F12 cannot drop the user to a text console
#   DontZap       - Ctrl+Alt+Backspace cannot kill the X server
#
# Recovery: pick "VS Code OS (maintenance shell)" in the boot menu, or append
#   systemd.unit=multi-user.target
# to the kernel command line to get a plain console instead of the kiosk.
Section "ServerFlags"
    Option "DontVTSwitch" "on"
    Option "DontZap"      "on"
    Option "BlankTime"    "0"
    Option "StandbyTime"  "0"
    Option "SuspendTime"  "0"
    Option "OffTime"      "0"
EndSection
