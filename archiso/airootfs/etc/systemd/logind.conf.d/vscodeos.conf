# VS Code OS kiosk behaviour:
#  - the power button still shuts the machine down cleanly
#  - closing the lid suspends
#  - the tty1 session is never killed, so the kiosk survives stray logouts
[Login]
HandlePowerKey=poweroff
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
KillUserProcesses=no
NAutoVTs=6
