name: Build images

# Tagging the repository builds both images and publishes them as one GitHub
# release:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
#   * VSCodeOS-<version>-x86_64.iso        - PCs (UEFI x64/ia32 and legacy BIOS)
#   * VSCodeOS-<version>-aarch64-rpi.img.xz - 64-bit Raspberry Pi boards
#
# The workflow can also be run by hand from the Actions tab, which uploads the
# images as build artifacts without touching releases.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which images to build'
        type: choice
        options: [both, x86_64, raspberrypi]
        default: both
      vscode_version:
        description: 'VS Code version to bundle ("latest" or e.g. 1.98.2)'
        required: false
        default: 'latest'

permissions:
  contents: write

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(date +%Y.%m.%d)-dev.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building VS Code OS ${version}"

  # The desktop shell is architecture-neutral JavaScript, so it is built once and
  # both image jobs consume the same artifact. Building it inside each image job
  # would mean two Node toolchains - pacman's in an Arch container, and
  # setup-node's on an arm64 Ubuntu runner - producing the same bytes twice.
  extension:
    name: Build VsCodeOsCore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Typecheck
        run: npm ci --prefix extension --no-audit --no-fund && npm run --prefix extension typecheck

      - name: Build
        run: ./scripts/build-extension.sh -o out/extension

      - uses: actions/upload-artifact@v7
        with:
          name: vscodeos-core-extension
          path: out/extension
          retention-days: 14

  x86_64:
    name: x86-64 ISO
    needs: [version, extension]
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["both","x86_64"]'), github.event.inputs.targets)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the prebuilt extension
        uses: actions/download-artifact@v8
        with:
          name: vscodeos-core-extension
          path: extension-dist

      - name: Free up disk space
        run: |
          echo "before:"; df -h / /mnt | tail -2
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift /usr/local/share/powershell \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force || true
          # The build tree (pacstrap root + squashfs) goes on /mnt, the roomy
          # ephemeral disk; only the finished ISO lands on /.
          sudo mkdir -p /mnt/vscodeos-work
          sudo chmod 0777 /mnt/vscodeos-work
          echo "after:"; df -h / /mnt | tail -2

      - name: Build the ISO
        # mkarchiso builds a chroot and mounts API filesystems inside it, which
        # a plain `container:` job cannot do - hence a privileged container
        # started by hand.
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          VSCODE_VERSION: ${{ github.event.inputs.vscode_version || 'latest' }}
        run: |
          # --pull always: the runner may already hold an archlinux:latest layer
          # from its image cache, and pacstrap installs from whatever package
          # databases this container syncs - so a stale base means a stale ISO.
          docker run --rm --privileged --pull always \
            -v "${PWD}:/build" \
            -v /mnt/vscodeos-work:/work \
            -w /build \
            -e ISO_VERSION="${BUILD_VERSION}" \
            -e VSCODE_VERSION="${VSCODE_VERSION}" \
            -e VSCODEOS_EXTENSION_PREBUILT=/build/extension-dist \
            archlinux:latest \
            bash -euo pipefail -c '
              # The keyring goes first and on its own: a base image older than
              # the current signing keys cannot verify the upgrade that follows.
              pacman -Sy --noconfirm --needed archlinux-keyring
              # A full upgrade, not just -S: mkarchiso pacstraps from the
              # databases this container syncs, so refreshing them here is what
              # puts current package versions into the image. grub is only an
              # optional dependency of archiso, but mkarchiso needs
              # grub-mkstandalone to build the UEFI boot modes.
              pacman -Syu --noconfirm --needed archiso git grub
              git config --global --add safe.directory /build
              ./scripts/build-iso.sh -v "${ISO_VERSION}" -w /work -o /build/out
            '

      - name: Summarise
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### x86-64 ISO"
            echo '| File | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            for f in out/*.iso; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            # Arch is a rolling release, so what shipped is decided by the
            # mirrors at build time - print it rather than leave it to trust.
            for m in out/*.packages.txt; do
              [ -e "$m" ] || continue
              echo
              echo "<details><summary>Shipped package versions ($(wc -l < "$m") packages)</summary>"
              echo
              ./scripts/pkg-versions.sh "$m" --markdown
              echo
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # A release asset over 2 GiB is rejected by the uploads API, which used to
      # surface as an HTTP 422 in the publish job - after both images had built.
      # Failing here instead costs minutes rather than the whole run.
      - name: Check the ISO fits a release asset
        run: |
          limit=$((2 * 1024 * 1024 * 1024))
          for f in out/*.iso; do
            size=$(stat -c%s "$f")
            printf '%s: %s bytes (limit %s)\n' "$(basename "$f")" "$size" "$limit"
            if (( size >= limit )); then
              echo "::error::$(basename "$f") is $((size / 1048576)) MiB; GitHub rejects release assets of 2 GiB or more. Trim archiso/packages.x86_64."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: VSCodeOS-${{ needs.version.outputs.version }}-x86_64
          path: |
            out/*.iso
            out/*.sha256
            out/*.packages.txt
          retention-days: 14
          compression-level: 0

  raspberrypi:
    name: Raspberry Pi image
    needs: [version, extension]
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["both","raspberrypi"]'), github.event.inputs.targets)
    # A native aarch64 runner means the build can chroot into the image
    # directly instead of emulating every command through qemu.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the prebuilt extension
        uses: actions/download-artifact@v8
        with:
          name: vscodeos-core-extension
          path: extension-dist

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libarchive-tools dosfstools e2fsprogs xz-utils util-linux curl
          echo "before:"; df -h / | tail -1

      - name: Build the image
        env:
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          VSCODE_VERSION: ${{ github.event.inputs.vscode_version || 'latest' }}
          VSCODEOS_EXTENSION_PREBUILT: ${{ github.workspace }}/extension-dist
        run: sudo -E ./rpi/build-image.sh -v "${BUILD_VERSION}" -o "${PWD}/out" -w /mnt/vscodeos-rpi

      - name: Summarise
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          {
            echo "### Raspberry Pi image"
            echo '| File | Size | SHA-256 |'
            echo '| --- | --- | --- |'
            for f in out/*.img.xz; do
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            for m in out/*.packages.txt; do
              [ -e "$m" ] || continue
              echo
              echo "<details><summary>Shipped package versions ($(wc -l < "$m") packages)</summary>"
              echo
              ./scripts/pkg-versions.sh "$m" --markdown
              echo
              echo '</details>'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: VSCodeOS-${{ needs.version.outputs.version }}-raspberrypi
          path: |
            out/*.img.xz
            out/*.sha256
            out/*.packages.txt
          retention-days: 14
          compression-level: 0

  release:
    name: Publish release
    needs: [version, x86_64, raspberrypi]
    # Only tags publish, and only when both images actually built.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Images only. Without the filter the extension bundle would be
          # downloaded too, and `gh release create artifacts/*` below would
          # publish it as a release asset.
          pattern: VSCodeOS-*
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -lh artifacts
          iso="VSCodeOS-${VERSION}-x86_64.iso"
          img="VSCodeOS-${VERSION}-aarch64-rpi.img.xz"

          cat > release-notes.md <<EOF
          A minimal Arch Linux system that boots straight into Visual Studio Code.
          The editor starts fullscreen on login and cannot be closed or minimised.

          | Download | For |
          | --- | --- |
          | \`${iso}\` | PCs - UEFI (x64 and ia32) and legacy BIOS |
          | \`${img}\` | 64-bit Raspberry Pi - Pi 5, 4, 400, CM4, 3 and Zero 2 W |

          ## PCs

          The ISO is a hybrid image: the same file boots from a USB stick or a
          burned CD/DVD.

          \`\`\`bash
          sudo dd if=${iso} of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`

          Boot it and VS Code comes up on its own; nothing touches the disk until
          you run \`sudo vscodeos-install\` from the editor's terminal.

          ## Raspberry Pi

          A Pi cannot boot an ISO - its firmware reads a FAT partition directly -
          so this is a flashable disk image. Write it to an SD card or USB drive
          with [Raspberry Pi Imager](https://www.raspberrypi.com/software/)
          ("Use custom" -> select the .img.xz), or:

          \`\`\`bash
          xz -dc ${img} | sudo dd of=/dev/sdX bs=4M status=progress oflag=sync
          \`\`\`

          There is no installer: the flashed card **is** the system, and the root
          filesystem expands to fill it on first boot. The image unpacks to 6 GiB,
          so use an 8 GB card or larger. The default login is
          \`vscodeos\` / \`vscodeos\` - change it with \`passwd\`.

          A 4 GB Pi 4 or a Pi 5 gives the best experience. Windows users: use
          Raspberry Pi Imager or [balenaEtcher](https://etcher.balena.io).

          ## What is inside

          Both images are pacstrapped from the current Arch Linux (and Arch
          Linux ARM) repositories on the day they are built, so the package
          versions move with every release. The \`.packages.txt\` file beside
          each image lists exactly what that build shipped, name and version.

          ## Verifying a download

          \`\`\`bash
          sha256sum -c ${iso}.sha256
          sha256sum -c ${img}.sha256
          \`\`\`
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "VS Code OS ${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            artifacts/*
